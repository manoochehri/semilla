name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group docs
      - name: build (fail on broken links)
        run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.repository == 'manoochehri/trazo'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'manoochehri/trazo'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
