[project]
name = "app"
version = "0.1.0"
description = "TODO: one line from .trazo/charter/charter.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9", "pre-commit>=4.6.2"]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.7.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
