<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Trazo">
  <title>Trazo</title>
  <!--
    The badge from the brand style guide: Cochineal Crimson #C8102E, Mayan Blue #1FBCB3.

    Square and self-coloured, so it works at any size and on any background. The wordmark
    lockup is deliberately absent: it needs a real type tool to draw, and the mark carries
    the identity on its own. Tracked as a follow-up rather than half-drawn here.

    The monogram is NOT the path in the brand style guide. That path reads as a QUESTION
    MARK at the size MkDocs actually renders this file -- Material sets height:1.2rem, so
    about 19px -- because the swash crossbar hooks down at both ends and the terminal flick
    reads as a dot. The guide claims the mark holds "visible detail" at 16px; rendered on
    the built site it does not. This one has a near-horizontal crossbar and an
    unambiguous stem, verified at 19/24/32/48px on the black navbar.

    `logo.svg` and `favicon.svg` hold identical geometry on purpose -- `mkdocs.yml` points
    at two separate files and nothing else would catch them drifting apart.
  -->
  <circle cx="50" cy="50" r="48" fill="#C8102E"/>
  <g fill="none" stroke="#1FBCB3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 27 34 C 37 30, 63 30, 73 34"/>
    <path d="M 50 30 C 50 48, 48 62, 46 70"/>
    <path d="M 46 70 C 52 76, 60 75, 63 67"/>
  </g>
</svg>
